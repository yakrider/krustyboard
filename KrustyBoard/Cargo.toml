
# we'll use codegen-backend to enable cranelift
cargo-features = ["codegen-backend"]


[package]
name = "krustyboard"
version = "1.4.6"
authors = ["yakrider <yakrider@gmail.com>"]
description = "Keyboard Remapping to support layer-2 and layer-3 functionality."
documentation = "https://docs.rs/krustyboard"
repository = "https://github.com/yakrider/krustyboard"
readme = "README.md"
keywords = ["hotkey", "autohotkey", "mouse", "keyboard", "shortcuts"]
categories = ["api-bindings"]
license = "MIT"
edition = "2024"
build = "build.rs"



[[bin]]
name = "krustyboard"
path = "src/bin/krustyboard/krustyboard.rs"


[package.metadata.winres]
OriginalFilename = "krustyboard.exe"
ProductName = "KrustyBoard"


[build-dependencies]
winres = "0.1"


[dependencies]
strum = { version = "0.24", features = ["derive"] }
strum_macros = "0.26"
derivative = "2"
atomic_refcell = "0.1"
brightness = "0.5"
async-trait = "0.1"
futures = "0.3"
rand = "0.10"
itertools = "0.12"
rustc-hash = "2"
derive_deref = "1"
base64 = "0.21"
tray-icon = "0.20"
tao = "0.33"
global-hotkey = "0.6"
colored = "3"
include_dir = "0.7.4"
winit = "0.30"
eframe = "0.31.0"
egui = "0.31.0"
egui_extras = { version = "0.31.0", features = ["all_loaders", "image"] }
image = { version = "0.25", features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
dirs = "6.0.0"
time = "0.3.41"
toml_edit = "0.22.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["local-time"] }
tracing-appender = "0.2"


[target.'cfg(windows)'.dependencies.windows]
version = "0.61.1"
features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
]




# we'll set general debug-info to lines-tables only to speed up compilation
# can remove this if we really need to debug, but should seldom be the case
[profile.dev]
debug = "line-tables-only"
codegen-backend = "cranelift"

# enable when profiling (e.g with FlameGraph)
#[profile.release]
#debug = true



# for faster builds, we can put the following sections in either ~/.cargo/config.toml or <PROJ>/.cargo/config.toml
#
# the parallel compilation frontend requires nightly
#[build]
#rustflags = ["-Z", "threads=8", "-C", "target-cpu=native"]
#rustc-wrapper = "sccache"
#
# Note that in ~/.cargo.config.toml we already use rust-lld .. eg:
#[target.x86_64-pc-windows-msvc]
#linker = "rust-lld"
#rustflags = ["-C", "link-arg=/threads:8"]


[lints.clippy]
erasing_op             = "warn"
missing_safety_doc     = "allow"
manual_non_exhaustive  = "allow"
new_without_default    = "allow"
upper_case_acronyms    = "allow"
blocks_in_conditions   = "allow"
needless_else          = "allow"
collapsible_if         = "allow"
collapsible_else_if    = "allow"

