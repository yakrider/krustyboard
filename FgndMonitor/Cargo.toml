[package]
name = "fg-mon"
version = "0.1.0"
edition = "2021"


[[bin]]
name = "fg-mon"
path = "src/fg_mon.rs"


[package.metadata.winres]
OriginalFilename = "fg-mon.exe"
ProductName = "Foreground Monitor"


[build-dependencies]
winres = "0.1"


[dependencies]

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_System_Threading",
]
